<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JobsMatch architecture: four Apify scrapers feed Supabase, which feeds the scoring engine and dashboard.">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC8A1F"/>
      <stop offset="100%" stop-color="#e8a83a"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0201A"/>
      <stop offset="100%" stop-color="#E0261E"/>
    </linearGradient>
    <linearGradient id="scrapeBarGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a030"/>
      <stop offset="100%" stop-color="#CC8A1F"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#CC8A1F"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#E0261E"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#888"/>
    </marker>

    <!-- Drop shadow -->
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.09"/>
    </filter>
    <filter id="heroShadow" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="440" fill="#fafafa"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#goldGrad)"/>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — COLLECTION
  ═══════════════════════════════════════════ -->
  <text x="24" y="30" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#CC8A1F" letter-spacing="2.5" opacity="0.8">COLLECTION LAYER — APIFY ACTORS</text>
  <line x1="24" y1="35" x2="776" y2="35" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       SCRAPER CARDS (row of 4)
       Card width: 170, gap: 14, total: 4×170+3×14 = 722, offset: (800-722)/2 = 39
  ═══════════════════════════════════════════ -->

  <!-- Card 1 — LinkedIn -->
  <g filter="url(#cardShadow)">
    <rect x="39" y="46" width="170" height="88" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <!-- gold cap -->
    <rect x="39" y="46" width="170" height="18" rx="7" fill="url(#scrapeBarGold)"/>
    <rect x="39" y="56" width="170" height="8" fill="url(#scrapeBarGold)"/>
  </g>
  <text x="124" y="60" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.92">APIFY ACTOR 01</text>
  <text x="124" y="90" font-family="'Bebas Neue', sans-serif" font-size="20" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">LinkedIn</text>
  <text x="124" y="106" font-family="Inter, sans-serif" font-size="9" fill="#777" text-anchor="middle">Job listings scraper</text>
  <text x="124" y="123" font-family="Poppins, sans-serif" font-size="8" fill="#CC8A1F" text-anchor="middle" font-weight="600">cron: 06:00 daily</text>

  <!-- Card 2 — Glassdoor -->
  <g filter="url(#cardShadow)">
    <rect x="223" y="46" width="170" height="88" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="223" y="46" width="170" height="18" rx="7" fill="url(#scrapeBarGold)"/>
    <rect x="223" y="56" width="170" height="8" fill="url(#scrapeBarGold)"/>
  </g>
  <text x="308" y="60" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.92">APIFY ACTOR 02</text>
  <text x="308" y="90" font-family="'Bebas Neue', sans-serif" font-size="20" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">Glassdoor</text>
  <text x="308" y="106" font-family="Inter, sans-serif" font-size="9" fill="#777" text-anchor="middle">Jobs + company ratings</text>
  <text x="308" y="123" font-family="Poppins, sans-serif" font-size="8" fill="#CC8A1F" text-anchor="middle" font-weight="600">cron: 06:15 daily</text>

  <!-- Card 3 — Indeed -->
  <g filter="url(#cardShadow)">
    <rect x="407" y="46" width="170" height="88" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="407" y="46" width="170" height="18" rx="7" fill="url(#scrapeBarGold)"/>
    <rect x="407" y="56" width="170" height="8" fill="url(#scrapeBarGold)"/>
  </g>
  <text x="492" y="60" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.92">APIFY ACTOR 03</text>
  <text x="492" y="90" font-family="'Bebas Neue', sans-serif" font-size="20" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">Indeed</text>
  <text x="492" y="106" font-family="Inter, sans-serif" font-size="9" fill="#777" text-anchor="middle">Job board listings</text>
  <text x="492" y="123" font-family="Poppins, sans-serif" font-size="8" fill="#CC8A1F" text-anchor="middle" font-weight="600">cron: 06:30 daily</text>

  <!-- Card 4 — ZipRecruiter -->
  <g filter="url(#cardShadow)">
    <rect x="591" y="46" width="170" height="88" rx="7" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="591" y="46" width="170" height="18" rx="7" fill="url(#scrapeBarGold)"/>
    <rect x="591" y="56" width="170" height="8" fill="url(#scrapeBarGold)"/>
  </g>
  <text x="676" y="60" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.2" opacity="0.92">APIFY ACTOR 04</text>
  <text x="676" y="90" font-family="'Bebas Neue', sans-serif" font-size="20" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">ZipRecruiter</text>
  <text x="676" y="106" font-family="Inter, sans-serif" font-size="9" fill="#777" text-anchor="middle">Job postings + salary data</text>
  <text x="676" y="123" font-family="Poppins, sans-serif" font-size="8" fill="#CC8A1F" text-anchor="middle" font-weight="600">cron: 06:45 daily</text>

  <!-- ═══════════════════════════════════════════
       NORMALIZE PILL
  ═══════════════════════════════════════════ -->
  <!-- Converging gold dashed arrows → normalize pill -->
  <line x1="124" y1="134" x2="349" y2="177" stroke="#CC8A1F" stroke-width="1.3"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="308" y1="134" x2="370" y2="177" stroke="#CC8A1F" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="492" y1="134" x2="430" y2="177" stroke="#CC8A1F" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="676" y1="134" x2="451" y2="177" stroke="#CC8A1F" stroke-width="1.3"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>

  <!-- Normalize pill -->
  <rect x="296" y="156" width="208" height="22" rx="11" fill="#fff8ec" stroke="#CC8A1F" stroke-width="1.2"/>
  <text x="400" y="170" font-family="Poppins, sans-serif" font-size="8" font-weight="600"
        fill="#CC8A1F" text-anchor="middle" letter-spacing="0.4">Normalize · Dedupe · Type-cast</text>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — STORAGE
  ═══════════════════════════════════════════ -->
  <text x="24" y="206" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#888" letter-spacing="2.5">STORAGE LAYER</text>
  <line x1="24" y1="210" x2="776" y2="210" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Arrow from pill to Supabase -->
  <line x1="400" y1="178" x2="400" y2="218" stroke="#CC8A1F" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <!-- ═══════════════════════════════════════════
       SUPABASE NODE
  ═══════════════════════════════════════════ -->
  <g filter="url(#heroShadow)">
    <rect x="196" y="218" width="408" height="78" rx="8" fill="url(#darkGrad)"/>
  </g>
  <!-- subtle inner highlight line -->
  <rect x="196" y="218" width="408" height="2" rx="1" fill="#3a3a3a" opacity="0.6"/>
  <text x="400" y="244" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="rgba(255,255,255,0.28)" text-anchor="middle" letter-spacing="3">SUPABASE — POSTGRESQL</text>
  <text x="400" y="270" font-family="'Bebas Neue', sans-serif" font-size="24" font-weight="400"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">Job Listings Database</text>
  <text x="400" y="286" font-family="Inter, sans-serif" font-size="9" fill="rgba(255,255,255,0.32)"
        text-anchor="middle">Structured rows · source-tagged · timestamped · indexed</text>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — INTELLIGENCE
  ═══════════════════════════════════════════ -->
  <!-- Arrow to scoring engine -->
  <line x1="400" y1="296" x2="400" y2="318" stroke="#E0261E" stroke-width="2" marker-end="url(#arrowRed)"/>

  <text x="24" y="315" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#888" letter-spacing="2.5">INTELLIGENCE LAYER</text>
  <line x1="24" y1="320" x2="776" y2="320" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       SCORING ENGINE NODE
  ═══════════════════════════════════════════ -->
  <g filter="url(#cardShadow)">
    <rect x="152" y="326" width="496" height="64" rx="8" fill="url(#redGrad)"/>
  </g>
  <rect x="152" y="326" width="496" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>
  <text x="400" y="348" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="3">SCORING ENGINE</text>
  <text x="400" y="368" font-family="'Bebas Neue', sans-serif" font-size="22" font-weight="400"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">Matching Algorithm + Weighted Ranker</text>
  <text x="400" y="382" font-family="Inter, sans-serif" font-size="8.5"
        fill="rgba(255,255,255,0.52)" text-anchor="middle">Role fit · Seniority · Salary · Remote · Skills · Recency · Company rating</text>

  <!-- Arrow to dashboard -->
  <line x1="400" y1="390" x2="400" y2="408" stroke="#888" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- ═══════════════════════════════════════════
       DASHBOARD OUTPUT NODE
  ═══════════════════════════════════════════ -->
  <rect x="250" y="410" width="300" height="24" rx="5" fill="#1a1a1a"/>
  <text x="400" y="427" font-family="'Bebas Neue', sans-serif" font-size="13" font-weight="400"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.5">JobsMatch Dashboard — Ranked Feed</text>

  <!-- ═══════════════════════════════════════════
       LEGEND
  ═══════════════════════════════════════════ -->
  <rect x="604" y="224" width="168" height="86" rx="5" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
  <text x="616" y="240" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#bbb" letter-spacing="1.8">LEGEND</text>

  <line x1="616" y1="254" x2="642" y2="254" stroke="#CC8A1F" stroke-width="1.4" stroke-dasharray="4,3"/>
  <path d="M641,250.5 L641,257.5 L647,254 z" fill="#CC8A1F"/>
  <text x="652" y="257" font-family="Inter, sans-serif" font-size="8" fill="#666">Data flow (aggregated)</text>

  <line x1="616" y1="271" x2="648" y2="271" stroke="#E0261E" stroke-width="2"/>
  <path d="M647,267.5 L647,274.5 L653,271 z" fill="#E0261E"/>
  <text x="658" y="274" font-family="Inter, sans-serif" font-size="8" fill="#666">Score pipeline</text>

  <rect x="616" y="282" width="16" height="10" rx="2" fill="url(#redGrad)"/>
  <text x="637" y="291" font-family="Inter, sans-serif" font-size="8" fill="#666">Algorithm stage</text>

  <rect x="616" y="296" width="16" height="10" rx="2" fill="#1a1a1a"/>
  <text x="637" y="305" font-family="Inter, sans-serif" font-size="8" fill="#666">Storage / UI layer</text>
</svg>
