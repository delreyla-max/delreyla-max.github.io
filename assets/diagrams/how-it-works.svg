<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LifeOS architecture: data sources feed Supabase, which feeds a signal engine and the dashboard zones.">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC8A1F"/>
      <stop offset="100%" stop-color="#e8a830"/>
    </linearGradient>
    <linearGradient id="goldCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0a030"/>
      <stop offset="100%" stop-color="#CC8A1F"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0201A"/>
      <stop offset="100%" stop-color="#E0261E"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#CC8A1F"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#444444"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0.5 L0,7.5 L9,4 z" fill="#999999"/>
    </marker>

    <!-- Drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="heroShadow" x="-6%" y="-6%" width="112%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="680" height="400" fill="#fafafa"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="680" height="4" fill="url(#goldGrad)"/>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — DATA SOURCES
  ═══════════════════════════════════════════ -->
  <text x="20" y="28" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#CC8A1F" letter-spacing="2.5" opacity="0.8">DATA SOURCES</text>
  <line x1="20" y1="33" x2="660" y2="33" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       SOURCE CARDS (5 across)
       Card w=106, gap=10, total=5×106+4×10=570, offset=(680-570)/2=55
  ═══════════════════════════════════════════ -->

  <!-- Card 1 — Work + Projects -->
  <g filter="url(#cardShadow)">
    <rect x="55" y="43" width="106" height="68" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <rect x="55" y="43" width="106" height="16" rx="6" fill="url(#goldCapGrad)"/>
    <rect x="55" y="51" width="106" height="8" fill="url(#goldCapGrad)"/>
  </g>
  <text x="108" y="56" font-family="Poppins, sans-serif" font-size="6" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.5" opacity="0.92">WORK + PROJECTS</text>
  <text x="108" y="82" font-family="'Bebas Neue', sans-serif" font-size="15" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.3">Task Tracker</text>
  <text x="108" y="98" font-family="Inter, sans-serif" font-size="8" fill="#999" text-anchor="middle">Automated pull</text>

  <!-- Card 2 — Finance -->
  <g filter="url(#cardShadow)">
    <rect x="171" y="43" width="106" height="68" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <rect x="171" y="43" width="106" height="16" rx="6" fill="url(#goldCapGrad)"/>
    <rect x="171" y="51" width="106" height="8" fill="url(#goldCapGrad)"/>
  </g>
  <text x="224" y="56" font-family="Poppins, sans-serif" font-size="6" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.5" opacity="0.92">FINANCE</text>
  <text x="224" y="82" font-family="'Bebas Neue', sans-serif" font-size="15" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.3">Financial Snapshot</text>
  <text x="224" y="98" font-family="Inter, sans-serif" font-size="8" fill="#999" text-anchor="middle">Automated pull</text>

  <!-- Card 3 — Health -->
  <g filter="url(#cardShadow)">
    <rect x="287" y="43" width="106" height="68" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <rect x="287" y="43" width="106" height="16" rx="6" fill="url(#goldCapGrad)"/>
    <rect x="287" y="51" width="106" height="8" fill="url(#goldCapGrad)"/>
  </g>
  <text x="340" y="56" font-family="Poppins, sans-serif" font-size="6" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.5" opacity="0.92">HEALTH</text>
  <text x="340" y="82" font-family="'Bebas Neue', sans-serif" font-size="15" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.3">Health Metrics</text>
  <text x="340" y="98" font-family="Inter, sans-serif" font-size="8" fill="#999" text-anchor="middle">Automated pull</text>

  <!-- Card 4 — Habits + Creative -->
  <g filter="url(#cardShadow)">
    <rect x="403" y="43" width="106" height="68" rx="6" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <rect x="403" y="43" width="106" height="16" rx="6" fill="url(#goldCapGrad)"/>
    <rect x="403" y="51" width="106" height="8" fill="url(#goldCapGrad)"/>
  </g>
  <text x="456" y="56" font-family="Poppins, sans-serif" font-size="6" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="0.5" opacity="0.92">HABITS + CREATIVE</text>
  <text x="456" y="82" font-family="'Bebas Neue', sans-serif" font-size="15" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.3">Habit Log</text>
  <text x="456" y="98" font-family="Inter, sans-serif" font-size="8" fill="#999" text-anchor="middle">Automated pull</text>

  <!-- Card 5 — Manual Prompts (muted / dashed) -->
  <rect x="519" y="43" width="106" height="68" rx="6" fill="#f7f7f7" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="572" y="75" font-family="'Bebas Neue', sans-serif" font-size="15" font-weight="400"
        fill="#bbb" text-anchor="middle" letter-spacing="0.3">Manual Prompts</text>
  <text x="572" y="93" font-family="Inter, sans-serif" font-size="8" fill="#ccc" text-anchor="middle">Daily / weekly review</text>

  <!-- ═══════════════════════════════════════════
       AUTOMATION PULL PILL + CONVERGING ARROWS
  ═══════════════════════════════════════════ -->
  <!-- Arrows from sources → normalize pill (tip at y=152) -->
  <line x1="108" y1="111" x2="294" y2="152" stroke="#CC8A1F" stroke-width="1.3"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="224" y1="111" x2="316" y2="152" stroke="#CC8A1F" stroke-width="1.4"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="340" y1="111" x2="340" y2="152" stroke="#CC8A1F" stroke-width="1.5"
        marker-end="url(#arrowGold)"/>
  <line x1="456" y1="111" x2="364" y2="152" stroke="#CC8A1F" stroke-width="1.4"
        stroke-dasharray="5,4" marker-end="url(#arrowGold)"/>
  <line x1="572" y1="111" x2="386" y2="152" stroke="#ccc" stroke-width="1.1"
        stroke-dasharray="3,4" marker-end="url(#arrowGold)"/>

  <!-- Automation pill -->
  <rect x="260" y="131" width="160" height="22" rx="11" fill="#fff8ec" stroke="#CC8A1F" stroke-width="1.2"/>
  <text x="340" y="145" font-family="Poppins, sans-serif" font-size="8" font-weight="600"
        fill="#CC8A1F" text-anchor="middle" letter-spacing="0.3">Automation pull layer</text>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — STORAGE
  ═══════════════════════════════════════════ -->
  <!-- Arrow pill → Supabase -->
  <line x1="340" y1="153" x2="340" y2="178" stroke="#CC8A1F" stroke-width="1.5" marker-end="url(#arrowGold)"/>

  <text x="20" y="175" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#888" letter-spacing="2.5">STORAGE LAYER</text>
  <line x1="20" y1="180" x2="660" y2="180" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       SUPABASE NODE
  ═══════════════════════════════════════════ -->
  <g filter="url(#heroShadow)">
    <rect x="190" y="185" width="300" height="70" rx="8" fill="url(#darkGrad)"/>
  </g>
  <rect x="190" y="185" width="300" height="2" rx="1" fill="#3a3a3a" opacity="0.6"/>
  <text x="340" y="209" font-family="Poppins, sans-serif" font-size="7.5" font-weight="700"
        fill="rgba(255,255,255,0.28)" text-anchor="middle" letter-spacing="3">DATABASE</text>
  <text x="340" y="235" font-family="'Bebas Neue', sans-serif" font-size="26" font-weight="400"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">Supabase</text>
  <text x="340" y="248" font-family="Inter, sans-serif" font-size="9"
        fill="rgba(255,255,255,0.32)" text-anchor="middle">Central source of truth</text>

  <!-- ═══════════════════════════════════════════
       LAYER LABEL — SIGNAL ENGINE
  ═══════════════════════════════════════════ -->
  <!-- Arrow Supabase → signal engine -->
  <line x1="340" y1="255" x2="340" y2="280" stroke="#444" stroke-width="1.8" marker-end="url(#arrowDark)"/>

  <text x="20" y="278" font-family="Poppins, sans-serif" font-size="8" font-weight="700"
        fill="#888" letter-spacing="2.5">SIGNAL ENGINE</text>
  <line x1="20" y1="283" x2="660" y2="283" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════
       SIGNAL ENGINE NODE
  ═══════════════════════════════════════════ -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="288" width="380" height="64" rx="8" fill="#ffffff" stroke="#E0261E" stroke-width="1.5"/>
    <!-- Red cap -->
    <rect x="150" y="288" width="380" height="18" rx="8" fill="url(#redGrad)"/>
    <rect x="150" y="298" width="380" height="8" fill="url(#redGrad)"/>
  </g>
  <text x="340" y="302" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="2" opacity="0.92">SIGNAL ENGINE</text>
  <text x="340" y="326" font-family="'Bebas Neue', sans-serif" font-size="18" font-weight="400"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="0.5">Threshold + Indicator Rules</text>

  <!-- Status dots inline -->
  <circle cx="204" cy="343" r="5.5" fill="#22c55e"/>
  <text x="214" y="347" font-family="Inter, sans-serif" font-size="8.5" fill="#555">On track</text>

  <circle cx="283" cy="343" r="5.5" fill="#f59e0b"/>
  <text x="293" y="347" font-family="Inter, sans-serif" font-size="8.5" fill="#555">Drifting</text>

  <circle cx="362" cy="343" r="5.5" fill="#E0261E"/>
  <text x="372" y="347" font-family="Inter, sans-serif" font-size="8.5" fill="#555">Decide</text>

  <!-- Arrow signal engine → dashboard -->
  <line x1="340" y1="352" x2="340" y2="370" stroke="#999" stroke-width="1.6" marker-end="url(#arrowGray)"/>

  <!-- ═══════════════════════════════════════════
       DASHBOARD OUTPUT NODE
  ═══════════════════════════════════════════ -->
  <rect x="100" y="372" width="480" height="22" rx="5" fill="#1a1a1a"/>
  <text x="340" y="382" font-family="Poppins, sans-serif" font-size="7" font-weight="700"
        fill="rgba(255,255,255,0.38)" text-anchor="middle" letter-spacing="2">DASHBOARD ZONES</text>
  <text x="340" y="386" font-family="Inter, sans-serif" font-size="7" fill="rgba(255,255,255,0.0)"
        text-anchor="middle">spacer</text>

  <!-- Overwrite with a second text line inside the dark bar -->
  <rect x="100" y="372" width="480" height="26" rx="5" fill="#1a1a1a"/>
  <text x="340" y="383" font-family="Poppins, sans-serif" font-size="6.5" font-weight="700"
        fill="rgba(255,255,255,0.32)" text-anchor="middle" letter-spacing="1.5">DASHBOARD ZONES</text>
  <text x="340" y="394" font-family="'Bebas Neue', sans-serif" font-size="11" font-weight="400"
        fill="#ffffff" text-anchor="middle" letter-spacing="1.5">Daily Priority · Weekly Scorecard · Project Tracker · Habit Log · Snapshot</text>
</svg>
