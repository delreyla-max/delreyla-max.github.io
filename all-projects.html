<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Projects - Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Inter',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }

    /* Ã¢"â‚¬Ã¢"â‚¬ NAV Ã¢â‚¬" mirrors the homepage nav Ã¢"â‚¬Ã¢"â‚¬ */
    #site-nav {
      position:fixed; top:0; left:0; right:0; z-index:300;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.4rem clamp(1.2rem,4vw,2.8rem);
      border-bottom:1px solid rgba(0,0,0,0.1);
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    #nav-brand {
      font-family:'Bebas Neue',sans-serif;
      font-size:1.25rem;
      letter-spacing:0.04em;
      color:#000;
      display:flex; flex-direction:row; align-items:baseline; gap:0.5em; line-height:1.15;
      text-decoration:none; cursor:pointer;
    }
    #nav-brand .nav-brand-name { color:#000; }
    #nav-brand .nav-brand-tagline { color:#000000; letter-spacing:0.03em; }
    #nav-links { display:flex; align-items:center; gap:clamp(1rem,2.4vw,1.8rem); }
    #nav-links a {
      font-family:'Bebas Neue',sans-serif;
      font-size:1rem;
      letter-spacing:0.04em;
      color:#000; text-decoration:none;
      transition:opacity 0.25s;
    }
    #nav-links a:hover { opacity:0.5; }
    

    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * {
      display:block;
      transform:translateY(110%);
      animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .d0 > * { animation-delay:0.1s; }
    .d1 > * { animation-delay:0.24s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    main {
      flex:1; display:flex; justify-content:center;
      padding:clamp(7rem,14vw,9rem) clamp(1.2rem,4vw,2.8rem) clamp(4rem,8vw,6rem);
    }
    #ap-wrap { width:100%; max-width:78rem; }
    #ap-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(2.6rem,7.5vw,5rem);
      letter-spacing:-0.015em; line-height:0.95; color:#000;
    }
    #ap-desc {
      font-family:'Inter',sans-serif;
      font-size:clamp(0.85rem,1.4vw,1rem);
      font-weight:300; color:rgba(0,0,0,0.55);
      margin:0.6rem 0 0 0; line-height:1.6;
    }
    #ap-sub {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.2rem,3.6vw,1.8rem);
      letter-spacing:-0.015em; color:#999999; line-height:0.95;
    }

    #ap-featured {
      margin-top:clamp(2.4rem,5vw,3.4rem);
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:clamp(0.9rem,1.8vw,1.4rem);
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.3s;
    }
    .ap-section-label {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1rem,2vw,1.4rem);
      letter-spacing:0.04em; color:#000;
      margin:clamp(2rem,4vw,3rem) 0 0 0;
      font-weight:400;
    }
    #ap-grid {
      margin-top:clamp(0.9rem,1.8vw,1.4rem);
      display:grid;
      grid-template-columns:repeat(5, minmax(0,1fr));
      gap:clamp(0.9rem,1.8vw,1.4rem);
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.4s;
    }
    #ap-grid-older {
      margin-top:clamp(0.9rem,1.8vw,1.4rem);
      display:grid;
      grid-template-columns:repeat(6, minmax(0,1fr));
      gap:clamp(0.5rem,0.9vw,0.75rem);
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.5s;
    }
    #ap-grid-older .ap-card {
      padding:clamp(0.5rem,0.8vw,0.7rem);
    }
    #ap-grid-older .ap-thumb {
      margin-bottom:0.45rem;
    }
    #ap-grid-older .ap-name {
      font-size:clamp(0.65rem,0.9vw,0.8rem);
      margin-bottom:0.15rem;
    }
    #ap-grid-older .ap-tag {
      font-size:0.52rem;
      padding:0.2rem 0.45rem;
    }
    .ap-card {
      display:block; text-decoration:none; color:inherit;
      background:#f2f2f2; border-radius:8px;
      padding:clamp(1rem,1.6vw,1.3rem);
      box-shadow:0 6px 12px rgba(0,0,0,0.12), 0 14px 40px rgba(0,0,0,0.05);
      border:1px solid rgba(0,0,0,0.05);
      transition:transform 0.35s ease, box-shadow 0.35s ease;
    }
    .ap-card:hover { transform:translateY(-4px); box-shadow:0 20px 50px rgba(0,0,0,0.1); }
    .ap-card--featured { background:#1a1a1a; border-color:rgba(255,255,255,0.08); }
    .ap-card--featured:hover { box-shadow:0 20px 50px rgba(0,0,0,0.35); }
    .ap-card--featured .ap-thumb { aspect-ratio:16/9; }
    .ap-card--featured .ap-thumb img { object-fit:cover; }
    .ap-card--featured .ap-card-title { font-size:clamp(1.2rem,2.4vw,1.8rem); }
    .ap-card--featured .ap-name { color:#fff; }
    .ap-card--featured .ap-tag { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.6); }
    .ap-thumb {
      aspect-ratio:16/10; border-radius:8px; overflow:hidden; margin-bottom:0.9rem;
      background:rgba(0,0,0,0.05);
      display:flex; align-items:center; justify-content:center;
    }
    .ap-thumb.has-image { background:#111; }
    .ap-thumb span {
      font-family:'Poppins',sans-serif; font-size:0.65rem;
      color:rgba(0,0,0,0.32); letter-spacing:0.04em;
    }
    .ap-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .ap-name {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.95rem,1.6vw,1.2rem);
      letter-spacing:0.01em; color:#000; margin-bottom:0.3rem;
    }
    .ap-tag {
      font-family:'Poppins',sans-serif;
      font-size:0.7rem; letter-spacing:0.04em;
      padding:0.35rem 0.85rem; border-radius:5px;
      background:rgba(0,0,0,0.05); color:rgba(0,0,0,0.55);
      display:inline-block;
    }
    .ap-tags {
      display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.4rem;
    }

    @media(max-width:640px){
      #ap-title { font-size:clamp(2.2rem,13vw,3.2rem); }
      #ap-sub { font-size:clamp(1.1rem,6.5vw,1.5rem); }
      #ap-featured { grid-template-columns:1fr; }
      #ap-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
      #ap-grid-older { grid-template-columns:repeat(3, minmax(0,1fr)); }
    }


  @media (max-width: 480px) {
    #nav-brand  { font-size: 1.5rem !important; }
    #nav-links a { font-size: 1.4rem !important; }
  }
  </style>
</head>
<body>

<nav id="site-nav">
  <a id="nav-brand" href="index.html"><span class="nav-brand-name">GARMAN Y.</span></a>
  <div id="nav-links">
    <a href="all-projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </div>
  
</nav>



<main>
  <div id="ap-wrap">
    <div class="hero-line d0"><span id="ap-title">All Projects</span></div>
    <p id="ap-desc">Systems, product design, CRM, and digital experiences.</p>

    <div id="ap-featured"><!-- featured projects --></div>
    <h2 class="ap-section-label">Selected Work</h2>
    <div id="ap-grid"><!-- selected work --></div>
    <h2 class="ap-section-label" id="ap-earlier-label" style="display:none;">Earlier Work</h2>
    <div id="ap-grid-older"><!-- earlier work --></div>
  </div>
</main>

<script src="projects-data.js"></script>
<script>
// Ã¢"â‚¬Ã¢"â‚¬Ã¢"â‚¬ Render the project grid from projects-data.js, sorted by "order" Ã¢"â‚¬Ã¢"â‚¬
(function () {
  var grid = document.getElementById('ap-grid');
  var gridOlder = document.getElementById('ap-grid-older');
  var earlierLabel = document.getElementById('ap-earlier-label');
  var featured = document.getElementById('ap-featured');
  var gridCount = 0;
  var list = (window.PROJECTS || []).slice().sort(function (a, b) {
    return (a.order || 0) - (b.order || 0);
  });
  list.forEach(function (p) {
    var card = document.createElement('a');
    card.className = 'ap-card' + (p.featured ? ' ap-card--featured' : '');
    card.href = p.url || ('project.html?id=' + encodeURIComponent(p.id));

    var thumb = document.createElement('div');
    thumb.className = 'ap-thumb';

    // Card thumbnail picking order:
    //   1. explicit "images[0]" (set via the "Card thumbnail filename" field in admin.html)
    //   2. the first image (or first image in an image-grid) found in the media gallery
    //   3. placeholder
    var thumbFile = null;
    if (p.images && p.images.length) {
      thumbFile = p.images[0];
    } else if (p.media && p.media.length) {
      for (var m = 0; m < p.media.length; m++) {
        var block = p.media[m];
        if (block && block.type === 'image' && block.src) { thumbFile = block.src; break; }
        if (block && block.type === 'image-grid' && block.items && block.items.length) { thumbFile = block.items[0]; break; }
      }
    }

    if (p.folder && thumbFile) {
      thumb.classList.add('has-image');
      var img = document.createElement('img');
      img.src = p.folder + '/' + thumbFile;
      img.alt = p.title;
      thumb.appendChild(img);
    } else {
      var span = document.createElement('span');
      span.innerHTML = 'Thumbnail<br>placeholder';
      thumb.appendChild(span);
    }

    var name = document.createElement('div');
    name.className = 'ap-name';
    name.textContent = p.title;

    var tag = document.createElement('div');
    tag.className = 'ap-tags';
    (p.tags || []).forEach(function(t) {
      var pill = document.createElement('div');
      pill.className = 'ap-tag';
      pill.textContent = t;
      tag.appendChild(pill);
    });

    card.appendChild(thumb);
    card.appendChild(name);
    card.appendChild(tag);
    if (p.featured) {
      featured.appendChild(card);
    } else if (gridCount < 10) {
      gridCount++;
      grid.appendChild(card);
    } else {
      if (gridCount === 10) earlierLabel.style.display = '';
      gridCount++;
      gridOlder.appendChild(card);
    }
  });
})();
</script>



</body>
</html>
