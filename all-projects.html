<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Projects â€” Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Inter',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }

    /* â”€â”€ NAV â€” mirrors the homepage nav â”€â”€ */
    #site-nav {
      position:fixed; top:0; left:0; right:0; z-index:300;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.4rem clamp(1.2rem,4vw,2.8rem);
      border-bottom:1px solid rgba(0,0,0,0.1);
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    #nav-brand {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1rem,1.6vw,1.25rem);
      letter-spacing:0.04em;
      color:#000;
      display:flex; flex-direction:row; align-items:baseline; gap:0.5em; line-height:1.15;
      text-decoration:none; cursor:pointer;
    }
    #nav-brand .nav-brand-name { color:#999999; }
    #nav-brand .nav-brand-tagline { color:#000000; letter-spacing:0.03em; }
    #nav-links { display:flex; align-items:center; gap:clamp(1rem,2.4vw,1.8rem); }
    #nav-links a {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.85rem,1.4vw,1.1rem);
      letter-spacing:0.04em;
      color:#000; text-decoration:none;
      transition:opacity 0.25s;
    }
    #nav-links a:hover { opacity:0.5; }

    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * {
      display:block;
      transform:translateY(110%);
      animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .d0 > * { animation-delay:0.1s; }
    .d1 > * { animation-delay:0.24s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    main {
      flex:1; display:flex; justify-content:center;
      padding:clamp(7rem,14vw,9rem) clamp(1.2rem,4vw,2.8rem) clamp(4rem,8vw,6rem);
    }
    #ap-wrap { width:100%; max-width:78rem; }
    #ap-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(2.6rem,7.5vw,5rem);
      letter-spacing:-0.015em; line-height:0.95; color:#000;
    }
    #ap-sub {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.2rem,3.6vw,1.8rem);
      letter-spacing:-0.015em; color:#999999; line-height:0.95;
    }

    #ap-grid {
      margin-top:clamp(2.4rem,5vw,3.4rem);
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:clamp(0.9rem,1.8vw,1.4rem);
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.4s;
    }
    .ap-card {
      display:block; text-decoration:none; color:inherit;
      background:#fff; border-radius:8px;
      padding:clamp(1rem,1.6vw,1.3rem);
      box-shadow:0 6px 12px rgba(0,0,0,0.12), 0 14px 40px rgba(0,0,0,0.05);
      border:1px solid rgba(0,0,0,0.05);
      transition:transform 0.35s ease, box-shadow 0.35s ease;
    }
    .ap-card:hover { transform:translateY(-4px); box-shadow:0 20px 50px rgba(0,0,0,0.1); }
    .ap-thumb {
      aspect-ratio:16/10; border-radius:8px; overflow:hidden; margin-bottom:0.9rem;
      background:rgba(0,0,0,0.05);
      display:flex; align-items:center; justify-content:center;
    }
    .ap-thumb.has-image { background:#111; }
    .ap-thumb span {
      font-family:'Poppins',sans-serif; font-size:0.65rem;
      color:rgba(0,0,0,0.32); letter-spacing:0.04em;
    }
    .ap-thumb img { width:100%; height:100%; object-fit:fill; display:block; }
    .ap-name {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.95rem,1.6vw,1.2rem);
      letter-spacing:0.01em; color:#000; margin-bottom:0.3rem;
    }
    .ap-tag {
      font-family:'Poppins',sans-serif;
      font-size:0.7rem; color:rgba(0,0,0,0.45);
    }

    @media(max-width:640px){
      #ap-title { font-size:clamp(2.2rem,13vw,3.2rem); }
      #ap-sub { font-size:clamp(1.1rem,6.5vw,1.5rem); }
      #ap-grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
    }


    /* â”€â”€ "All Projects" mega-menu (mirrors homepage) â”€â”€ */
    #nav-megamenu {

      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-left:1px solid rgba(0,0,0,0.08);

      overflow-y:auto;
      visibility:hidden; transform:translateX(100%);
      transition:transform 0.35s cubic-bezier(0.16,1,0.3,1), visibility 0s linear 0.35s;
    }
    #nav-megamenu.open {
      visibility:visible; transform:translateX(0);
      transition:transform 0.35s cubic-bezier(0.16,1,0.3,1), visibility 0s;
    }
    #nav-megamenu-grid {
      display:flex;
      flex-direction:column;
      gap:clamp(0.7rem,1.4vw,1.1rem);
    }
    @media(max-width:640px){
      #nav-megamenu { width:80% !important; min-width:0; }
    }
    .hero-card {
      background:#fff; border-radius:10px;
      padding:clamp(0.7rem,1.12vw,0.91rem);
      box-shadow:0 6px 12px rgba(0,0,0,0.22), 0 14px 40px rgba(0,0,0,0.07);
      border:1px solid rgba(0,0,0,0.05);
      display:flex; flex-direction:column;
      max-height:252px; overflow:hidden;
      transition:transform 0.35s ease, box-shadow 0.35s ease;
    }
    .hero-card:hover { transform:translateY(-4px); box-shadow:0 20px 50px rgba(0,0,0,0.1); }
    a.hero-card-title { text-decoration:none; display:block; transition:opacity 0.2s ease; }
    a.hero-card { text-decoration:none; color:inherit; }
    a.hero-card-title:hover { opacity:0.6; }
    .hero-card-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.77rem,1.26vw,1.05rem);
      letter-spacing:0.01em; color:#000; margin-bottom:0.385rem;
    }
    .hero-card-tags { display:flex; flex-wrap:wrap; gap:0.245rem; margin-bottom:0.49rem; }
    .hero-card-tag {
      font-family:'Poppins',sans-serif;
      font-size:0.41rem; letter-spacing:0.04em;
      padding:0.196rem 0.455rem; border-radius:5px;
      background:rgba(0,0,0,0.05); color:rgba(0,0,0,0.55);
    }
    .hero-card-desc {
      font-family:'Poppins',sans-serif;
      font-size:0.49rem; line-height:1.7; font-weight:300;
      color:rgba(0,0,0,0.5); margin-bottom:0.63rem;
    }
    .hero-card-body { display:contents; }
    .hero-card-thumb {
      order:1; margin-top:auto; border-radius:6px; overflow:hidden;
      aspect-ratio:16/10; background:#111;
    }
    .hero-card-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    #nav-megamenu .hero-card-thumb img { object-fit:contain; }
    /* Megamenu cards always use the side-by-side row layout */
    #nav-megamenu .hero-card {
      flex-direction:row; align-items:flex-start;
      gap:0.8rem; padding:0.85rem;
      max-height:none; overflow:visible;
    }
    #nav-megamenu .hero-card-body { flex:1; min-width:0; display:flex; flex-direction:column; }
    #nav-megamenu .hero-card-thumb {
      order:0; margin-top:0; flex-shrink:0;
      width:5rem; aspect-ratio:1/1;
    }
    #nav-megamenu .hero-card-title { font-size:0.95rem; margin-bottom:0.35rem; }
    #nav-megamenu .hero-card-tags { margin-bottom:0; }

    .hero-card-all-projects {
      text-decoration:none;
      display:flex; align-items:center; justify-content:center;
      min-height:5rem;
    }
    .hero-card-all-inner {
      display:flex; flex-direction:column; align-items:flex-start;
    }

    .hero-card-list {
      display:grid; grid-template-columns:repeat(2, 1fr);
      gap:0.21rem 0.56rem; margin-bottom:0.7rem;
    }
    .hero-card-list .client-name { line-height:1.4; }
    .hero-card-cta {
      margin-top:auto;
      display:inline-flex; align-items:center; gap:0.28rem;
      align-self:flex-start;
      font-family:'Bebas Neue',sans-serif;
      font-size:0.546rem; letter-spacing:0.16em;
      color:#fff; background:#000;
      padding:0.42rem 0.77rem; border-radius:4px;
      text-decoration:none;
      transition:opacity 0.25s ease, transform 0.25s ease;
    }
    .hero-card-cta:hover { opacity:0.8; transform:translateY(-1px); }
    .hero-card-cta svg { width:6px; height:6px; }

    .client-name {
      font-family:'Poppins',sans-serif;
      font-size:clamp(0.46rem,0.72vw,0.56rem);
      font-weight:400;
      color:rgba(0,0,0,0.45);
      line-height:1.45;
      text-decoration:none;
      display:inline-block;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
      transition:font-weight 0.3s ease, color 0.3s ease;
    }
    .client-name:hover {
      font-weight:600;
      color:#000;
    }

    @media(max-width:640px){
      #nav-megamenu-grid { grid-template-columns:1fr; max-width:26rem; }
      .hero-card {
        flex-direction:row; align-items:flex-start;
        gap:0.8rem; padding:0.85rem;
        min-height:clamp(5.5rem,26vw,7.2rem);
        max-height:none; overflow:visible;
      }
      .hero-card-body { flex:1; min-width:0; display:flex; flex-direction:column; }
      .hero-card-thumb {
        order:0; margin-top:0; flex-shrink:0;
        width:clamp(4.2rem,22vw,5.5rem);
        aspect-ratio:1/1;
      }
    .hero-card-title { font-size:0.95rem; margin-bottom:0.35rem; }
      .hero-card-tags { margin-bottom:0.4rem; }
      .hero-card-tag { font-size:0.5rem; padding:0.22rem 0.5rem; }
      .hero-card-desc {

      .hero-card-cta svg { width:8px; height:8px; }
    }

  </style>
</head>

<main>
  <div id="ap-wrap">
    <div class="hero-line d0"><span id="ap-title">All Projects</span></div>
    <div class="hero-line d1"><span id="ap-sub">Every brand, one place.</span></div>

    <div id="ap-grid"><!-- populated dynamically from projects-data.js, sorted by "order" --></div>

<script src="projects-data.js"></script>
<script>
// â”€â”€â”€ Render the project grid from projects-data.js, sorted by "order" â”€â”€
(function () {
  var grid = document.getElementById('ap-grid');
  var list = (window.PROJECTS || []).slice().sort(function (a, b) {
    return (a.order || 0) - (b.order || 0);
  });
  list.forEach(function (p) {
    var card = document.createElement('a');
    card.className = 'ap-card';
    card.href = 'project.html?id=' + encodeURIComponent(p.id);

    var thumb = document.createElement('div');
    thumb.className = 'ap-thumb';

    // Card thumbnail picking order:
    //   1. explicit "images[0]" (set via the "Card thumbnail filename" field in admin.html)
    //   2. the first image (or first image in an image-grid) found in the media gallery
    //   3. placeholder
    var thumbFile = null;
    if (p.images && p.images.length) {
      thumbFile = p.images[0];
    } else if (p.media && p.media.length) {
      for (var m = 0; m < p.media.length; m++) {
        var block = p.media[m];
        if (block && block.type === 'image' && block.src) { thumbFile = block.src; break; }
        if (block && block.type === 'image-grid' && block.items && block.items.length) { thumbFile = block.items[0]; break; }
      }
    }

    if (p.folder && thumbFile) {
      thumb.classList.add('has-image');
      var img = document.createElement('img');
      img.src = p.folder + '/' + thumbFile;
      img.alt = p.title;
      thumb.appendChild(img);
    } else {
      var span = document.createElement('span');
      span.innerHTML = 'Thumbnail<br>placeholder';
      thumb.appendChild(span);
    }

    var name = document.createElement('div');
    name.className = 'ap-name';
    name.textContent = p.title;

    var tag = document.createElement('div');
    tag.className = 'ap-tag';
    tag.textContent = (p.tags || []).join(' Â· ');

    card.appendChild(thumb);
    card.appendChild(name);
    card.appendChild(tag);
    grid.appendChild(card);
  });
})();
</script>

<script>
// â”€â”€â”€ "All Projects" mega-menu â€” full-width dropdown shown on hover â”€â”€
(function () {
  var navEl    = document.getElementById('site-nav');
  var trigger  = document.getElementById('nav-all-projects');
  var menuEl   = document.getElementById('nav-megamenu');
  if (!navEl || !trigger || !menuEl) return;

  var hideTimer = null;
  function open()  { clearTimeout(hideTimer); menuEl.classList.add('open'); }
  function close() { hideTimer = setTimeout(function () { menuEl.classList.remove('open'); }, 150); }

  trigger.addEventListener('mouseenter', open);
  trigger.addEventListener('mouseleave', close);
  menuEl.addEventListener('mouseenter', open);
  menuEl.addEventListener('mouseleave', close);

  // Close drawer on click outside
  document.addEventListener('click', function(e) {
    if (menuEl.classList.contains('open') && !menuEl.contains(e.target) && !trigger.contains(e.target)) {
      menuEl.classList.remove('open');
    }
  });
})();
</script>
