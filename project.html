<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Project - Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Poppins',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }
    #nav-links a:hover::after,
    

    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * {
      display:block;
      transform:translateY(110%);
      animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .d0 > * { animation-delay:0.1s; }
    .d1 > * { animation-delay:0.22s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    main {
      flex:1; display:flex; justify-content:center;
      padding:clamp(7rem,14vw,9rem) clamp(1.2rem,4vw,2.8rem) clamp(4rem,8vw,6rem);
    }
    #project-wrap { width:100%; max-width:54rem; }

    .project-eyebrow-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:0.6rem;
    }
    .project-eyebrow {
      font-family:'Bebas Neue',sans-serif;
      letter-spacing:0.18em; text-transform:uppercase;
      color:#999999; font-size:clamp(0.75rem,1.4vw,0.9rem);
    }
    .eyebrow-arrows { display:flex; align-items:center; gap:0.3rem; }
    .eyebrow-arrow-btn {
      display:flex; align-items:center; justify-content:center;
      width:1.8rem; height:1.8rem; border-radius:50%;
      border:1px solid rgba(0,0,0,0.15);
      color:#000; text-decoration:none;
      transition:background 0.2s, border-color 0.2s;
    }
    .eyebrow-arrow-btn:hover { background:rgba(0,0,0,0.06); border-color:rgba(0,0,0,0.3); }
    .eyebrow-arrow-btn.disabled { opacity:0.2; pointer-events:none; }
    .eyebrow-arrow-btn svg { width:9px; height:9px; }
    .project-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(2.6rem,7.5vw,5rem);
      letter-spacing:0.02em; line-height:0.95; color:#000;
    }
    .project-credit {
      font-family:'Poppins',sans-serif;
      font-size:0.85rem; color:rgba(0,0,0,0.45);
      margin-top:0.9rem;
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.5s;
    }
    .project-tags {
      display:flex; flex-wrap:wrap; gap:0.5rem;
      margin-top:1rem;
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.6s;
    }
    .project-tag {
      font-family:'Poppins',sans-serif;
      font-size:0.7rem; letter-spacing:0.04em;
      padding:0.35rem 0.85rem; border-radius:5px;
      background:rgba(0,0,0,0.05); color:rgba(0,0,0,0.55);
    }

    .project-thumb {
      margin-top:clamp(2.2rem,5vw,3.2rem);
      aspect-ratio:16/9; border-radius:8px; overflow:hidden;
      background:rgba(0,0,0,0.04); border:1px dashed rgba(0,0,0,0.15);
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:2rem;
      opacity:0; animation:sFadeUp 0.8s ease forwards; animation-delay:0.7s;
    }
    .project-thumb span {
      font-family:'Poppins',sans-serif;
      font-size:0.8rem; color:rgba(0,0,0,0.35); line-height:1.6;
    }
    .project-thumb img { width:100%; height:100%; object-fit:cover; display:block; }

    /* â"€â"€â"€ Project media gallery â€" flexible, block-based per project â"€â"€â"€ */
    .project-media {
      margin-top:clamp(2.2rem,5vw,3.2rem);
      display:flex; flex-direction:column; gap:clamp(1.2rem,3vw,2rem);
    }
    .media-block {
      opacity:0; animation:sFadeUp 0.8s ease forwards;
    }
    .media-block.is-image img {
      width:100%; height:auto; display:block; border-radius:8px;
    }
    .media-block.is-video video {
      width:100%; display:block; border-radius:8px; overflow:hidden;
      object-fit:cover;
    }
    .media-block.is-image .media-frame,
    .media-block.is-video .media-frame {
      border-radius:8px; overflow:hidden; background:#111;
    }
    .media-embed-frame {
      position:relative; width:100%; padding-top:56.25%; /* 16:9 */
      border-radius:8px; overflow:hidden; background:#111;
    }
    .media-embed-frame iframe {
      position:absolute; top:0; left:0; width:100%; height:100%; border:0;
    }
    /* Masonry grid via CSS columns â€" each image keeps its natural aspect
       ratio and the layout flows like Pinterest. Column count is set per
       block (data-cols) and tightened on small screens via the media query. */
    .media-grid {
      column-gap:clamp(0.6rem,1.6vw,1rem);
      column-count:3;
    }
    .media-grid .media-frame {
      break-inside:avoid; -webkit-column-break-inside:avoid;
      margin-bottom:clamp(0.6rem,1.6vw,1rem);
      border-radius:8px; overflow:hidden; background:#111;
    }
    .media-grid img { width:100%; height:auto; display:block; }
    .project-section-body {
      font-family:'Poppins',sans-serif;
      font-size:0.72rem; line-height:1.7; font-weight:300;
      color:rgba(0,0,0,0.6); white-space:pre-line;
    }
    .project-section-heading {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.85rem,1.6vw,1.05rem);
      letter-spacing:0.04em; color:#000;
    }
    .media-caption {
      margin-top:0.6rem; font-family:'Poppins',sans-serif;
      font-size:0.78rem; color:rgba(0,0,0,0.4); line-height:1.6;
    }
    @media(max-width:640px){
      .media-grid { column-count:2 !important; }
    }

    /* â"€â"€ LIGHTBOX â"€â"€ */
    .media-grid img, .media-block.is-image img { cursor:zoom-in; }
    #lightbox {
      position:fixed; inset:0; z-index:900;
      background:rgba(0,0,0,0.92);
      display:flex; align-items:center; justify-content:center;
      opacity:0; visibility:hidden;
      transition:opacity 0.25s ease, visibility 0s linear 0.25s;
    }
    #lightbox.open {
      opacity:1; visibility:visible;
      transition:opacity 0.25s ease, visibility 0s;
    }
    #lightbox-img {
      max-width:92vw; max-height:90vh;
      object-fit:contain;
      border-radius:4px;
      transform:scale(0.97);
      transition:transform 0.25s ease;
      user-select:none;
    }
    #lightbox.open #lightbox-img { transform:scale(1); }
    #lightbox-close {
      position:fixed; top:1.4rem; right:1.6rem;
      background:none; border:none; cursor:pointer;
      color:#fff; font-size:1.8rem; line-height:1;
      opacity:0.7; transition:opacity 0.2s;
      z-index:901;
    }
    #lightbox-close:hover { opacity:1; }
    .lightbox-arrow {
      position:fixed; top:50%; transform:translateY(-50%);
      background:rgba(255,255,255,0.1); border:none; cursor:pointer;
      color:#fff; width:3rem; height:3rem; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      opacity:0.6; transition:opacity 0.2s, background 0.2s;
      z-index:901;
    }
    .lightbox-arrow:hover { opacity:1; background:rgba(255,255,255,0.2); }
    .lightbox-arrow.hidden { opacity:0; pointer-events:none; }
    #lightbox-prev { left:1.2rem; }
    #lightbox-next { right:1.2rem; }
    #lightbox-counter {
      position:fixed; bottom:1.4rem; left:50%; transform:translateX(-50%);
      font-family:'Poppins',sans-serif; font-size:0.65rem; letter-spacing:0.1em;
      color:rgba(255,255,255,0.45);
    }

    .project-columns {
      margin-top:clamp(2.6rem,6vw,3.8rem);
      display:grid; grid-template-columns:repeat(3, 1fr);
      gap:clamp(1.6rem,4vw,2.6rem);
    }
    .project-section {
      opacity:0; animation:sFadeUp 0.7s ease forwards;
    }
    .project-section h2 {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(0.85rem,1.6vw,1.05rem);
      letter-spacing:0.04em; color:#000; margin-bottom:0.3rem;
    }
    .project-section p {
      font-family:'Poppins',sans-serif;
      font-size:0.72rem; line-height:1.7; font-weight:300;
      color:rgba(0,0,0,0.6);
      white-space:pre-line;
    }
    #sec-brief   { animation-delay:0.8s; }
    #sec-work    { animation-delay:0.9s; }
    #sec-outcome { animation-delay:1s; }

    @media(max-width:880px){
      .project-columns { grid-template-columns:1fr; gap:clamp(1.6rem,5vw,2.2rem); }
    }

    #project-not-found {
      font-family:'Poppins',sans-serif; font-size:0.95rem;
      color:rgba(0,0,0,0.5); margin-top:clamp(7rem,14vw,9rem);
      display:none;
    }
    #project-not-found a { color:#000; }

    @media(max-width:640px){
      .project-title { font-size:clamp(2.2rem,13vw,3.2rem); }
      .project-credit { font-size:0.78rem; }
      .project-section h2 { font-size:1.15rem; }
      .project-section p { font-size:0.85rem; line-height:1.7; }
    }

    /* â"€â"€ "All Projects" mega-menu (mirrors homepage) â"€â"€ */

  @media (max-width: 640px) {
    .psi-row { flex-direction: column !important; }
    .psi-div { display: none !important; }
    .psi-row > div { padding: 0 0 20px !important; }
  }
  </style>
</head>
<body>
<script src="nav.js"></script>

<main>
  <div id="project-wrap" style="display:none;">
    <div class="project-eyebrow-row">
      <span class="project-eyebrow" id="p-eyebrow"></span>
      <div class="eyebrow-arrows">
        <a id="eyebrow-arrow-prev" class="eyebrow-arrow-btn disabled" href="#">
          <svg viewBox="0 0 10 10" fill="none"><path d="M6 1L2 5L6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a id="eyebrow-arrow-next" class="eyebrow-arrow-btn disabled" href="#">
          <svg viewBox="0 0 10 10" fill="none"><path d="M4 1L8 5L4 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>
    <div class="hero-line d1"><h1 class="project-title" id="p-title"></h1></div>
    <div class="project-credit" id="p-credit"></div>
    <div class="project-tags" id="p-tags"></div>

    <div class="psi-row" style="display:flex;padding:40px 0 20px;">
      <div id="sec-brief" style="flex:1;display:flex;flex-direction:column;gap:14px;padding:0 28px;">
        <div style="background:#dc2626;height:2px;width:28px;margin-bottom:4px;"></div>
        <p style="font-size:10px;font-weight:800;letter-spacing:1px;">PROBLEM</p>
        <p id="p-brief" style="font-size:11px;color:#6e6e6e;line-height:18px;"></p>
      </div>
      <div class="psi-div" style="width:1px;background:#e1e1e1;align-self:stretch;"></div>
      <div id="sec-work" style="flex:1;display:flex;flex-direction:column;gap:14px;padding:0 28px;">
        <div style="background:#dc2626;height:2px;width:28px;margin-bottom:4px;"></div>
        <p style="font-size:10px;font-weight:800;letter-spacing:1px;">SOLUTION</p>
        <p id="p-work" style="font-size:11px;color:#6e6e6e;line-height:18px;"></p>

      <div class="psi-div" style="width:1px;background:#e1e1e1;align-self:stretch;"></div>

        <div style="background:#dc2626;height:2px;width:28px;margin-bottom:4px;"></div>
        <p style="font-size:10px;font-weight:800;letter-spacing:1px;">IMPACT</p>
        <p id="p-outcome" style="font-size:11px;color:#6e6e6e;line-height:18px;"></p>
      </div>
    </div>

    <div class="project-thumb" id="project-thumb" style="display:none;">
      <span id="p-thumb-placeholder">Image placeholder</span>
    </div>

    <div class="project-media" id="project-media"></div>

  </div>

  <div id="project-not-found">
    Could not find that project. <a href="all-projects.html">Back to All Projects</a>
  </div>
</main>

<script src="projects-data.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var id = params.get("id");
  var list = window.PROJECTS || [];
  var data = null;
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { data = list[i]; break; }
  }

  if (!data) {
    document.getElementById("project-not-found").style.display = "block";
    return;
  }

  document.getElementById("page-title").textContent = data.title + " - Garman";
  document.getElementById("p-eyebrow").textContent = data.eyebrow || "";
  document.getElementById("p-title").textContent = data.title || "";
  document.getElementById("p-credit").textContent = data.credit || "";
  document.getElementById("p-brief").textContent = data.brief || "";
  document.getElementById("p-work").textContent = data.work || "";
  document.getElementById("p-outcome").textContent = data.outcome || "";

  var tagsEl = document.getElementById("p-tags");
  (data.tags || []).forEach(function (tag) {
    var el = document.createElement("div");
    el.className = "project-tag";
    el.textContent = tag;
    tagsEl.appendChild(el);
  });

  // â"€â"€â"€ Media gallery â€" each project can lay its assets out differently â"€â"€
  var mediaWrap = document.getElementById("project-media");
  var media = data.media || [];
  var folder = data.folder || "this-project";

  function makeCaption(text) {
    if (!text) return null;
    var cap = document.createElement("div");
    cap.className = "media-caption";
    cap.textContent = text;
    return cap;
  }

  function makeEmbedFrame(src, allow, block) {
    var w = block.embedWidth ? parseInt(block.embedWidth) : 0;
    var h = block.embedHeight ? parseInt(block.embedHeight) : 0;
    var iframe = document.createElement("iframe");
    iframe.src = src;
    iframe.setAttribute("allow", allow);
    iframe.setAttribute("allowfullscreen", "");
    if (w || h) {
      var outer = document.createElement("div");
      outer.style.width = w ? w + "px" : "100%";
      outer.style.height = h ? h + "px" : "auto";
      outer.style.borderRadius = "8px";
      outer.style.overflow = "hidden";
      iframe.style.cssText = "width:100%;height:100%;border:0;display:block;";
      if (!h) iframe.style.aspectRatio = "16/9";
      outer.appendChild(iframe);
      return outer;
    }
    var frame = document.createElement("div");
    frame.className = "media-embed-frame";
    iframe.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;border:0;";
    frame.appendChild(iframe);
    return frame;
  }

  function vimeoEmbed(id, block) {
    return makeEmbedFrame(
      "https://player.vimeo.com/video/" + encodeURIComponent(id),
      "autoplay; fullscreen; picture-in-picture",
      block || {}
    );
  }

  function youtubeEmbed(id, block) {
    return makeEmbedFrame(
      "https://www.youtube.com/embed/" + encodeURIComponent(id),
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture",
      block || {}
    );
  }

  function buildEmbedWrap(block, idx) {
    var wrap = document.createElement("div");
    wrap.className = "media-block is-embed";
    wrap.style.animationDelay = (0.15 * idx) + "s";
    if (block.type === "vimeo") wrap.appendChild(vimeoEmbed(block.id, block));
    else wrap.appendChild(youtubeEmbed(block.id, block));
    var caption = makeCaption(block.caption);
    if (caption) wrap.appendChild(caption);
    return wrap;
  }

  if (media.length) {
    var mi = 0;
    while (mi < media.length) {
      var block = media[mi];
      if (!block || !block.type) { mi++; continue; }

      var isEmbed = (block.type === "vimeo" || block.type === "youtube");

      if (isEmbed && block.columns === 2 && block.id) {
        // collect up to 2 consecutive 2-col embeds into a side-by-side row
        var group = [block];
        if (mi + 1 < media.length) {
          var next = media[mi + 1];
          if (next && (next.type === "vimeo" || next.type === "youtube") && next.columns === 2 && next.id) {
            group.push(next);
            mi++;
          }
        }
        var row = document.createElement("div");
        row.style.cssText = "display:grid;grid-template-columns:repeat(" + group.length + ",1fr);gap:clamp(0.6rem,1.6vw,1rem);";
        group.forEach(function (b, gi) { row.appendChild(buildEmbedWrap(b, mi - group.length + 1 + gi)); });
        mediaWrap.appendChild(row);
        mi++; continue;
      }

      var wrap = document.createElement("div");
      wrap.style.animationDelay = (0.15 * mi) + "s";

      if (block.type === "image" && block.src) {
        wrap.className = "media-block is-image";
        var frame = document.createElement("div");
        frame.className = "media-frame";
        var img = document.createElement("img");
        img.src = folder + "/" + block.src;
        img.alt = block.caption || data.title;
        frame.appendChild(img);
        wrap.appendChild(frame);
      } else if (block.type === "image-grid" && block.items && block.items.length) {
        wrap.className = "media-block is-image";
        var grid = document.createElement("div");
        grid.className = "media-grid";
        var cols = parseInt(block.columns, 10);
        if (!cols || cols < 1) cols = 3;
        if (cols > 6) cols = 6;
        grid.style.columnCount = cols;
        block.items.forEach(function (filename) {
          var gFrame = document.createElement("div");
          gFrame.className = "media-frame";
          var gImg = document.createElement("img");
          gImg.src = folder + "/" + filename;
          gImg.alt = block.caption || data.title;
          gFrame.appendChild(gImg);
          grid.appendChild(gFrame);
        });
        wrap.appendChild(grid);
      } else if (block.type === "video" && block.src) {
        wrap.className = "media-block is-video";
        var vFrame = document.createElement("div");
        vFrame.className = "media-frame";
        var video = document.createElement("video");
        video.src = folder + "/" + block.src;
        video.controls = true;
        video.playsInline = true;
        vFrame.appendChild(video);
        wrap.appendChild(vFrame);
      } else if (isEmbed && block.id) {
        wrap.className = "media-block is-embed";
        if (block.type === "vimeo") wrap.appendChild(vimeoEmbed(block.id, block));
        else wrap.appendChild(youtubeEmbed(block.id, block));
      } else if (block.type === "text" && block.src) {
        wrap.className = "media-block is-text";
        var p = document.createElement("p");
        p.className = "project-section-body";
        p.textContent = block.src;
        wrap.appendChild(p);
      } else if (block.type === "heading" && block.src) {
        wrap.className = "media-block is-heading";
        var h = document.createElement("h2");
        h.className = "project-section-heading";
        h.textContent = block.src;
        wrap.appendChild(h);
      } else {
        mi++; continue;
      }

      var caption = makeCaption(block.caption);
      if (caption) wrap.appendChild(caption);
      mediaWrap.appendChild(wrap);
      mi++;
    }
  }

  if (!mediaWrap.children.length) {
    // Nothing in "media" â€" fall back to the legacy single-thumbnail field,
    // or show a placeholder explaining how to add a gallery.
    var thumb = document.getElementById("project-thumb");
    thumb.style.display = "flex";
    if (data.folder && data.images && data.images.length) {
      thumb.innerHTML = "";
      thumb.style.border = "none";
      thumb.style.background = "#111";
      var legacyImg = document.createElement("img");
      legacyImg.src = data.folder + "/" + data.images[0];
      legacyImg.alt = data.title;
      thumb.appendChild(legacyImg);
    } else {
      document.getElementById("p-thumb-placeholder").textContent =
        "No media yet. Open admin.html and add media blocks to this project.";
    }
  }

  document.getElementById("project-wrap").style.display = "block";

  // â"€â"€â"€ Prev / Next navigation â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€
  var sorted = (window.PROJECTS || []).slice().sort(function (a, b) {
    return (a.order || 0) - (b.order || 0);
  });
  var idx = sorted.findIndex(function (p) { return p.id === id; });
  var prev = idx > 0 ? sorted[idx - 1] : null;
  var next = idx < sorted.length - 1 ? sorted[idx + 1] : null;

  // Eyebrow arrows
  var eyePrev = document.getElementById("eyebrow-arrow-prev");
  var eyeNext = document.getElementById("eyebrow-arrow-next");
  if (prev) { eyePrev.href = prev.url || ("project.html?id=" + encodeURIComponent(prev.id)); eyePrev.classList.remove("disabled"); }
  if (next) { eyeNext.href = next.url || ("project.html?id=" + encodeURIComponent(next.id)); eyeNext.classList.remove("disabled"); }

})();
</script>

<!-- â"€â"€ LIGHTBOX â"€â"€ -->
<div id="lightbox">
  <button id="lightbox-close" aria-label="Close">&times;</button>
  <button class="lightbox-arrow" id="lightbox-prev" aria-label="Previous">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M7 1L3 5L7 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-arrow" id="lightbox-next" aria-label="Next">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3 1L7 5L3 9" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="lightbox-counter"></div>
</div>

<script>
(function () {
  var lb       = document.getElementById('lightbox');
  var lbImg    = document.getElementById('lightbox-img');
  var lbClose  = document.getElementById('lightbox-close');
  var lbPrev   = document.getElementById('lightbox-prev');
  var lbNext   = document.getElementById('lightbox-next');
  var lbCount  = document.getElementById('lightbox-counter');

  var images = [];  // all clickable images on the page
  var current = 0;

  function collectImages() {
    images = Array.from(document.querySelectorAll('.media-block.is-image img, .media-grid img'));
  }

  function open(idx) {
    current = idx;
    lbImg.src = images[current].src;
    lbImg.alt = images[current].alt;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    updateUI();
  }

  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    setTimeout(function () { lbImg.src = ''; }, 250);
  }

  function updateUI() {
    lbCount.textContent = (current + 1) + ' / ' + images.length;
    lbPrev.classList.toggle('hidden', current === 0);
    lbNext.classList.toggle('hidden', current === images.length - 1);
  }

  function prev() { if (current > 0) { current--; lbImg.src = images[current].src; updateUI(); } }
  function next() { if (current < images.length - 1) { current++; lbImg.src = images[current].src; updateUI(); } }

  // Wire up clicks on images after page renders
  window.addEventListener('load', function () {
    collectImages();
    images.forEach(function (img, i) {
      img.addEventListener('click', function () { open(i); });
    });
  });

  lbClose.addEventListener('click', close);
  lbPrev.addEventListener('click', prev);
  lbNext.addEventListener('click', next);

  // Close on backdrop click
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

  // Keyboard nav
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });
})();
</script>

</body>
</html>
