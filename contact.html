<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Inter',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }

    /* â"€â"€ NAV â€" mirrors the homepage nav â"€â"€ */
    #site-nav {
      position:fixed; top:0; left:0; right:0; z-index:400;
      display:flex; align-items:center; justify-content:space-between;
      padding:1.4rem clamp(1.2rem,4vw,2.8rem);
      border-bottom:1px solid rgba(0,0,0,0.1);
      background:rgba(255,255,255,0.92);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    #nav-brand {
      font-family:'Bebas Neue',sans-serif;
      font-size:1.25rem;
      letter-spacing:0.04em;
      color:#000;
      display:flex; flex-direction:row; align-items:baseline; gap:0.5em; line-height:1.15;
      text-decoration:none; cursor:pointer;
    }
    #nav-brand .nav-brand-name { color:#000; }
    #nav-brand .nav-brand-tagline { color:#000000; letter-spacing:0.03em; }
    #nav-links { display:flex; align-items:center; gap:clamp(1rem,2.4vw,1.8rem); }
    #nav-links a {
      font-family:'Bebas Neue',sans-serif;
      font-size:1rem;
      letter-spacing:0.04em;
      color:#000; text-decoration:none;
      transition:opacity 0.25s;
      position:relative; padding-bottom:2px;
    }
    #nav-links a::after {
      content:''; position:absolute; left:0; bottom:0; width:0; height:2px;
      background:#dc2626; transition:width 0.25s ease;
    }
    #nav-links a:hover { opacity:1; }
    #nav-links a:hover::after,
    #nav-links a.active::after { width:100%; }
    

    /* â"€â"€ PAGE LAYOUT â"€â"€ */
    main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:clamp(7rem,14vw,9rem) clamp(1.2rem,4vw,2.8rem) clamp(3rem,7vw,5rem);
    }
    #contact-wrap { width:100%; max-width:34rem; }
    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * {
      display:block;
      transform:translateY(110%);
      animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .d0 > * { animation-delay:0.1s; }
    .d1 > * { animation-delay:0.26s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    #contact-title {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(3rem,9vw,6.5rem);
      letter-spacing:-0.015em;
      color:#000;
      line-height:0.95;
    }
    #contact-sub {
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(1.4rem,4.2vw,2.6rem);
      letter-spacing:-0.015em;
      color:#999999;
      line-height:0.95;
    }

    #contact-form {
      margin-top:clamp(2rem,4.5vw,3rem);
      display:flex; flex-direction:column; gap:1.2rem;
      opacity:0; animation:sFadeUp 0.7s ease forwards; animation-delay:0.5s;
    }
    .field { display:flex; flex-direction:column; gap:0.5rem; }
    .field label {
      font-family:'Bebas Neue',sans-serif;
      font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
      color:rgba(0,0,0,0.4);
    }
    .field input,
    .field textarea {
      font-family:'Poppins',sans-serif;
      font-size:0.9rem; color:#000;
      background:transparent;
      border:none; border-bottom:1px solid rgba(0,0,0,0.15);
      padding:0.6rem 0.1rem;
      transition:border-color 0.25s ease;
      resize:vertical;
    }
    .field input::placeholder,
    .field textarea::placeholder { color:rgba(0,0,0,0.3); }
    .field input:focus,
    .field textarea:focus { outline:none; border-color:#000; }
    .field textarea { min-height:8rem; line-height:1.6; }

    #contact-submit {
      align-self:flex-start;
      margin-top:0.6rem;
      display:inline-flex; align-items:center; gap:0.5rem;
      font-family:'Bebas Neue',sans-serif;
      font-size:0.95rem; letter-spacing:0.16em;
      color:#fff; background:#000;
      border:none; border-radius:5px;
      padding:0.85rem 1.8rem; cursor:pointer;
      transition:opacity 0.25s ease, transform 0.25s ease;
    }
    #contact-submit:hover { opacity:0.8; transform:translateY(-1px); }
    #contact-submit svg { width:10px; height:10px; }

    @media(max-width:640px){
      #contact-title { font-size:clamp(2.6rem,15vw,4rem); }
      #contact-sub   { font-size:clamp(1.3rem,7.5vw,2rem); }
    }
    /* â"€â"€ "All Projects" mega-menu (mirrors homepage) â"€â"€ */
  @media (max-width: 480px) {
    #nav-brand  { font-size: 1.5rem !important; }
    #nav-links a { font-size: 1.4rem !important; }
  }
    /* HAMBURGER NAV */
    @media (max-width: 768px) {
      #nav-links { display: none; }
      #nav-hamburger {
        display: flex; flex-direction: column; justify-content: center; gap: 5px;
        width: 2rem; height: 2rem; cursor: pointer; background: none; border: none; padding: 0;
      }
      #nav-hamburger span {
        display: block; height: 2px; width: 100%; background: #000;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      #nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      #nav-hamburger.open span:nth-child(2) { opacity: 0; }
      #nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
      #mobile-menu {
        display: flex; flex-direction: column; align-items: flex-end; gap: 1.2rem;
        position: fixed; top: 65px; left: 0; right: 0;
        background: rgba(0,0,0,0.97); backdrop-filter: blur(10px);
        z-index: 399; padding: 1.5rem 2rem 1.8rem;
        max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease; opacity: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      #mobile-menu.open { max-height: 400px; opacity: 1; }
      #mobile-menu a {
        font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.06em;
        color: #fff; text-decoration: none; transition: opacity 0.2s; text-align: right;
      }
      #mobile-menu a:hover { opacity: 0.4; }
    }
    @media (min-width: 769px) {
      #nav-hamburger { display: none; }
      #mobile-menu { display: none !important; }
    }
    #nav-brand { position:relative; padding-bottom:2px; }
    #nav-brand::after { content:""; position:absolute; left:0; bottom:0; width:0; height:2px; background:#dc2626; transition:width 0.25s ease; }
    #nav-brand:hover::after, #nav-brand.active::after { width:100%; }  </style>
</head>
<body>

<nav id="site-nav">
  <a id="nav-brand" href="index.html"><span class="nav-brand-name">GARMAN Y.</span></a>
  <div id="nav-links">
    <a href="all-projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </div>
  
<button id="nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div id="mobile-menu">
  <a href="index.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Home</a>
  <a href="all-projects.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Projects</a>
  <a href="resume.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Resume</a>
  <a href="contact.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Contact</a>
</div>


<main>
  <div id="contact-wrap">
    <div class="hero-line d0"><span id="contact-title">Let's talk.</span></div>
    <div class="hero-line d1"><span id="contact-sub">Send a message.</span></div>

    <form id="contact-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Tell me a bit about your project..." autocomplete="off" required></textarea>
      </div>
      <button type="submit" id="contact-submit">
        SEND MESSAGE
        <svg viewBox="0 0 10 10" fill="none"><path d="M1 9L9 1M9 1H3M9 1V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p id="form-status" style="margin-top:1rem;font-size:0.9rem;min-height:1.2em;"></p>
    </form>

    <script>
    (function(){
      var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhMixwmUj4TYEGhyi2ty1ok3xOgffWpjm-YX6Redfd5KLg6pLn16k4kNJ1Sfkxb60z/exec';
      var form = document.getElementById('contact-form');
      var status = document.getElementById('form-status');
      var btn = document.getElementById('contact-submit');

      form.addEventListener('submit', function(e){
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'SENDING...';
        status.textContent = '';

        var data = {
          name:    document.getElementById('name').value,
          email:   document.getElementById('email').value,
          message: document.getElementById('message').value
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(res.result === 'success'){
            status.style.color = '#2a7a2a';
            status.textContent = 'Message sent! I\'ll be in touch soon.';
            form.reset();
          } else {
            throw new Error('failed');
          }
        })
        .catch(function(){
          status.style.color = '#c00';
          status.textContent = 'Something went wrong. Please try again or email directly.';
        })
        .finally(function(){
          btn.disabled = false;
          btn.innerHTML = 'SEND MESSAGE <svg viewBox="0 0 10 10" fill="none"><path d="M1 9L9 1M9 1H3M9 1V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        });
      });
    })();
    </script>
  </div>
</main>


<script>
(function(){
  var btn = document.getElementById('nav-hamburger');
  var menu = document.getElementById('mobile-menu');
  if (!btn || !menu) return;
  btn.addEventListener('click', function() {
    btn.classList.toggle('open');
    menu.classList.toggle('open');
  });
})();
</script>
<script>
(function(){
  var path = window.location.pathname.split("/").pop() || "index.html";
  // Brand active on homepage
  if (path === "index.html" || path === "") {
    var brand = document.getElementById("nav-brand");
    if (brand) brand.classList.add("active");
  }
  // Projects active on case study / project pages
  var isProject = path.indexOf("-case-study") !== -1 || path === "project.html" || path === "all-projects.html";
  document.querySelectorAll("#nav-links a").forEach(function(a) {
    var href = a.getAttribute("href");
    if (href === path) { a.classList.add("active"); }
    else if (isProject && href === "all-projects.html") { a.classList.add("active"); }
  });
})();
</script>
</body>
</html>
