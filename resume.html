<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Inter',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }

    main { flex:1; padding:calc(65px + 50px) 20px clamp(4rem,8vw,6rem); }
    #page-wrap { width:100%; max-width:56rem; margin:0 auto; }

    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * { display:block; transform:translateY(110%); animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards 0.22s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    .cs-eyebrow { font-family:'Bebas Neue',sans-serif; letter-spacing:0.18em; text-transform:uppercase; color:#999; font-size:clamp(0.75rem,1.4vw,0.9rem); display:block; padding:0 0 8px; }
    .cs-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.6rem,7.5vw,5rem); letter-spacing:0.02em; line-height:0.95; color:#000; }

    .resume-dl-wrap {
      display:flex; justify-content:center; padding:10px 0;
    }
    .resume-dl-btn {
      display:inline-flex; align-items:center; gap:0.5rem;
      font-family:'Bebas Neue',sans-serif; font-size:0.85rem; letter-spacing:0.16em;
      color:#fff; background:#000; border-radius:5px;
      padding:0.7rem 1.4rem; text-decoration:none;
      transition:opacity 0.25s ease, transform 0.25s ease;
      opacity:0; animation:sFadeUp 0.6s ease forwards 0.5s;
    }
    .resume-dl-btn:hover { opacity:0.8; transform:translateY(-1px); }
    .resume-dl-btn svg { width:10px; height:10px; }

    #resume-iframe {
      width:100%;
      border:none;
      border-radius:4px;
      margin-top:0;
      height:2400px;
    }

    @media (max-width:768px) {
      html { overflow-x: clip; }
      body { overflow-x: clip; overflow-y: auto; }
      main { padding-left:20px; padding-right:20px; }
      #page-wrap { max-width:100%; }
      #resume-iframe { border-radius:0; height:2200px; width:calc(136% + 40px); margin-left:calc(-18% - 20px); }
    }
  </style>
</head>
<body>
<script src="nav.js"></script>

<main>
  <div id="page-wrap">
    <div class="resume-dl-wrap">
      <a class="resume-dl-btn" href="https://docs.google.com/document/d/e/2PACX-1vR354cYhmbs1YbpsLhFoUxH8XE7qSgFEIwH13BB-bzSsJ3L1E3GQZjEaDQcSp-pXw/pub?output=pdf" target="_blank" download="Garman_Resume.pdf">
        DOWNLOAD RESUME
        <svg viewBox="0 0 10 10" fill="none"><path d="M5 1V8M5 8L2 5M5 8L8 5M1.5 9H8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <iframe
      id="resume-iframe"
      src="https://docs.google.com/document/d/e/2PACX-1vTE-f1_-pZi2wnhGWdtrbOOzba7e0_zhEuUoQNwAtyRVWNY-wYSlOA94AUwUmVnPQ/pub?embedded=true"
      title="Resume"
    ></iframe>
  </div>
</main>

</body>
</html>
