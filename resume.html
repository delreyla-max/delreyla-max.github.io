<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - Garman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; min-height:100%; background:#fff; font-family:'Inter',sans-serif; color:#000; }
    body { display:flex; flex-direction:column; }

    #site-nav { position:fixed; top:0; left:0; right:0; z-index:400; display:flex; align-items:center; justify-content:space-between; padding:1.4rem clamp(1.2rem,4vw,2.8rem); border-bottom:1px solid rgba(0,0,0,0.1); background:rgba(255,255,255,0.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    #nav-brand { font-family:'Bebas Neue',sans-serif; font-size:1.25rem; letter-spacing:0.04em; color:#000; text-decoration:none; }
    #nav-links { display:flex; align-items:center; gap:clamp(1rem,2.4vw,1.8rem); }
    #nav-hamburger { display: none; }
    #nav-links a { font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:0.04em; color:#000; text-decoration:none; transition:opacity 0.25s; position:relative; padding-bottom:2px; }
    #nav-links a::after { content:''; position:absolute; left:0; bottom:0; width:0; height:2px; background:#dc2626; transition:width 0.25s ease; }
    #nav-links a:hover { opacity:1; }
    #nav-links a:hover::after, #nav-links a.active::after { width:100%; }

    main { flex:1; padding:calc(65px + 50px) 20px clamp(4rem,8vw,6rem); }
    #page-wrap { width:100%; max-width:56rem; margin:0 auto; }

    .hero-line { overflow:hidden; line-height:1; }
    .hero-line > * { display:block; transform:translateY(110%); animation:sReveal 0.75s cubic-bezier(0.16,1,0.3,1) forwards 0.22s; }
    @keyframes sReveal { to { transform:translateY(0); } }
    @keyframes sFadeUp { to { opacity:1; } }

    .cs-eyebrow { font-family:'Bebas Neue',sans-serif; letter-spacing:0.18em; text-transform:uppercase; color:#999; font-size:clamp(0.75rem,1.4vw,0.9rem); display:block; padding:0 0 8px; }
    .cs-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.6rem,7.5vw,5rem); letter-spacing:0.02em; line-height:0.95; color:#000; }

    .resume-dl-wrap {
      display:flex; justify-content:center; padding:10px 0;
    }
    .resume-dl-btn {
      display:inline-flex; align-items:center; gap:0.5rem;
      font-family:'Bebas Neue',sans-serif; font-size:0.85rem; letter-spacing:0.16em;
      color:#fff; background:#000; border-radius:5px;
      padding:0.7rem 1.4rem; text-decoration:none;
      transition:opacity 0.25s ease, transform 0.25s ease;
      opacity:0; animation:sFadeUp 0.6s ease forwards 0.5s;
    }
    .resume-dl-btn:hover { opacity:0.8; transform:translateY(-1px); }
    .resume-dl-btn svg { width:10px; height:10px; }

    #resume-iframe {
      width:100%;
      border:none;
      border-radius:4px;
      margin-top:0;
      height:2400px;
    }

    @media (max-width:768px) {
      html, body { overflow-x: hidden; }
      main { padding-left:20px; padding-right:20px; }
      #page-wrap { max-width:100%; }
      #resume-iframe { border-radius:0; height:2200px; width:calc(136% + 40px); margin-left:calc(-18% - 20px); }
    }
    @media (max-width:480px) {
      #nav-brand { font-size:1.5rem !important; }
      #nav-links a { font-size:1.4rem !important; }
    }
    /* HAMBURGER NAV */
    @media (max-width: 768px) {
      #nav-links { display: none; }
      #nav-hamburger {
        display: flex; flex-direction: column; justify-content: center; gap: 5px;
        width: 2rem; height: 2rem; cursor: pointer; background: none; border: none; padding: 0;
      }
      #nav-hamburger span {
        display: block; height: 2px; width: 100%; background: #000;
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      #nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      #nav-hamburger.open span:nth-child(2) { opacity: 0; }
      #nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
      #mobile-menu {
        display: flex; flex-direction: column; align-items: flex-end; gap: 1.2rem;
        position: fixed; top: 65px; left: 0; right: 0;
        background: rgba(0,0,0,0.97); backdrop-filter: blur(10px);
        z-index: 399; padding: 1.5rem 2rem 1.8rem;
        max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease; opacity: 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      #mobile-menu.open { max-height: 400px; opacity: 1; }
      #mobile-menu a {
        font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.06em;
        color: #fff; text-decoration: none; transition: opacity 0.2s; text-align: right;
      }
      #mobile-menu a:hover { opacity: 0.4; }
    }
    @media (min-width: 769px) {
      #nav-hamburger { display: none; }
      #mobile-menu { display: none !important; }
    }
    #nav-brand { position:relative; padding-bottom:2px; }
    #nav-brand::after { content:""; position:absolute; left:0; bottom:0; width:0; height:2px; background:#dc2626; transition:width 0.25s ease; }
    #nav-brand:hover::after, #nav-brand.active::after { width:100%; }  </style>
</head>
<body>

<nav id="site-nav">
  <a id="nav-brand" href="index.html">GARMAN Y.</a>
  <div id="nav-links">
    <a href="all-projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </div>
<button id="nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div id="mobile-menu">
  <a href="index.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Home</a>
  <a href="all-projects.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Projects</a>
  <a href="resume.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Resume</a>
  <a href="contact.html" onclick="document.getElementById('mobile-menu').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');">Contact</a>
</div>

<main>
  <div id="page-wrap">
    <div class="resume-dl-wrap">
      <a class="resume-dl-btn" href="https://docs.google.com/document/d/e/2PACX-1vR354cYhmbs1YbpsLhFoUxH8XE7qSgFEIwH13BB-bzSsJ3L1E3GQZjEaDQcSp-pXw/pub?output=pdf" target="_blank" download="Garman_Resume.pdf">
        DOWNLOAD RESUME
        <svg viewBox="0 0 10 10" fill="none"><path d="M5 1V8M5 8L2 5M5 8L8 5M1.5 9H8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <iframe
      id="resume-iframe"
      src="https://docs.google.com/document/d/e/2PACX-1vR354cYhmbs1YbpsLhFoUxH8XE7qSgFEIwH13BB-bzSsJ3L1E3GQZjEaDQcSp-pXw/pub?embedded=true"
      title="Resume"
    ></iframe>
  </div>
</main>

<script>
(function(){
  var btn = document.getElementById('nav-hamburger');
  var menu = document.getElementById('mobile-menu');
  if (!btn || !menu) return;
  btn.addEventListener('click', function() {
    btn.classList.toggle('open');
    menu.classList.toggle('open');
  });
})();
</script>
<script>
(function(){
  var path = window.location.pathname.split("/").pop() || "index.html";
  // Brand active on homepage
  if (path === "index.html" || path === "") {
    var brand = document.getElementById("nav-brand");
    if (brand) brand.classList.add("active");
  }
  // Projects active on case study / project pages
  var isProject = path.indexOf("-case-study") !== -1 || path === "project.html" || path === "all-projects.html";
  document.querySelectorAll("#nav-links a").forEach(function(a) {
    var href = a.getAttribute("href");
    if (href === path) { a.classList.add("active"); }
    else if (isProject && href === "all-projects.html") { a.classList.add("active"); }
  });
})();
</script>
</body>
</html>
